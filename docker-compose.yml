services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: proxy_llm_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd}"
    ports:
      - "1433:1433"
    volumes:
      - proxy_llm_mssql_data:/var/opt/mssql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: proxy_llm_backend
    depends_on:
      - sqlserver
    environment:
      # Set DATABASE_URL in repo root .env to point at a remote SSMS / Azure SQL instance.
      # If unset, defaults to the bundled sqlserver service (local dev).
      DATABASE_URL: "${DATABASE_URL:-mssql+aioodbc://sa:${MSSQL_SA_PASSWORD_URLENC:-YourStrong%40Passw0rd}@sqlserver:1433/${MSSQL_DB_NAME:-master}?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-sk-REPLACE_ME}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      ADMIN_API_KEY: "${ADMIN_API_KEY:-admin}"
      JWT_SECRET: "${JWT_SECRET:-change-me-long-random-string}"
      JWT_EXPIRE_HOURS: "${JWT_EXPIRE_HOURS:-5}"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
      TEAMS_WEBHOOK_URL: "${TEAMS_WEBHOOK_URL:-}"
      SPIKE_WINDOW_SECONDS: "${SPIKE_WINDOW_SECONDS:-60}"
      SPIKE_MAX_COST_USD: "${SPIKE_MAX_COST_USD:-5}"
      SPIKE_MAX_TOKENS: "${SPIKE_MAX_TOKENS:-500000}"
      SPIKE_MAX_REQUESTS: "${SPIKE_MAX_REQUESTS:-120}"
      BUDGET_THRESHOLD_FRACTION: "${BUDGET_THRESHOLD_FRACTION:-0.8}"
      ENABLE_IP_CHECK: "${ENABLE_IP_CHECK:-false}"
      ENABLE_HMAC_CHECK: "${ENABLE_HMAC_CHECK:-true}"
      HMAC_SIGNING_SECRET: "${HMAC_SIGNING_SECRET:-}"
      HMAC_MAX_SKEW_SECONDS: "${HMAC_MAX_SKEW_SECONDS:-300}"
      HMAC_NONCE_TTL_SECONDS: "${HMAC_NONCE_TTL_SECONDS:-600}"
      LOG_TO_FILES: "${LOG_TO_FILES:-true}"
      LOG_DIR: "${LOG_DIR:-logs}"
      DEV_LOG_FILE: "${DEV_LOG_FILE:-dev.log}"
      AUDIT_LOG_FILE: "${AUDIT_LOG_FILE:-audit.log}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_ENCRYPTION_KEY: "${LOG_ENCRYPTION_KEY:-}"
      LOG_ENCRYPT_AUDIT: "${LOG_ENCRYPT_AUDIT:-true}"
      LOG_ENCRYPT_DEV: "${LOG_ENCRYPT_DEV:-false}"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: proxy_llm_frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: "http://backend:8000"
      ADMIN_API_KEY: "${ADMIN_API_KEY:-admin}"
      JWT_SECRET: "${JWT_SECRET:-change-me-long-random-string}"
      JWT_EXPIRE_HOURS: "${JWT_EXPIRE_HOURS:-5}"
      CHOKIDAR_USEPOLLING: "1"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  proxy_llm_mssql_data:
